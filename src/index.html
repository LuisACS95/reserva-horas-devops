<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Horas - Salud</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Agendamiento de Horas Médicas</h1>
            <p>Plataforma de Reserva (Entorno DevOps)</p>
            <div id="status-indicator">Servicio Operativo</div>
        </header>
        <main>
            <form id="booking-form">
                <div class="form-group">
                    <label for="nombre">Nombre del Paciente:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ingrese su nombre completo">
                </div>
                <div class="form-group">
                    <label for="especialidad">Especialidad:</label>
                    <select id="especialidad" name="especialidad">
                        <option value="medicina_general">Medicina General</option>
                        <option value="pediatria">Pediatría</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha y Hora de Cita:</label>
                    <input type="datetime-local" id="fecha" name="fecha" required>
                </div>
                <button type="submit" class="btn">Confirmar Reserva</button>
            </form>
        </main>
    </div>
</body>
</html>
